stages:
  - test

variables:
  UV_CACHE_DIR: .uv-cache
  UV_CACHE_POLICY: pull
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.12"
  BASE_LAYER: trixie-slim
  UV_LINK_MODE: copy

default:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
      policy:  $UV_CACHE_POLICY
  before_script:
    - uv sync --frozen

uv-sync:
  stage: .pre
  variables:
    UV_CACHE_POLICY: pull-push
  script: 
    - uv cache prune --ci

uv-lock-check:
  stage: test
  before_script: []
  cache: []
  script:
    - uv lock --check

pytest:
  stage: test
  script:
    - uv run pytest

create-schedule:
  stage: test
  script:
    - uv run make_schedule.py
    - test *1.jpg
    - test *2.jpg
